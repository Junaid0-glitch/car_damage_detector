<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Damage Detector AI</title>
    <style>
        :root {
            --bg-dark: #121212;
            /* Slight gradient for the card background for depth */
            --bg-card: linear-gradient(145deg, #252525, #1a1a1a); 
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #6c5ce7;
            --accent-hover: #5b4cc4;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Subtle background pattern */
            background-image: radial-gradient(circle at top right, rgba(108, 92, 231, 0.1) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            border-radius: 24px; /* Softer corners */
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: fadeIn 0.8s ease-out;
            border: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        h1 { text-align: center; margin-bottom: 25px; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; font-size: 1.8rem; }

        /* Warning Box */
        .warning-box {
            background: rgba(255, 118, 117, 0.15);
            border-left: 4px solid #ff7675;
            color: #ffcccc;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Tabs */
        .tabs { display: flex; margin-bottom: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 5px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-radius: 10px; color: var(--text-secondary); transition: all 0.3s ease; font-weight: 500; }
        .tab.active { background-color: rgba(255,255,255,0.1); color: var(--text-primary); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        /* Inputs */
        .input-group { display: none; margin-bottom: 25px; animation: slideIn 0.3s ease; }
        .input-group.active { display: block; }
        @keyframes slideIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

        input[type="text"] { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444; padding: 14px; border-radius: 12px; color: white; outline: none; margin-bottom: 15px; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2); }
        
        .file-wrapper {
            position: relative; height: 160px; border: 2px dashed #444; border-radius: 16px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.3s ease; background: var(--glass); overflow: hidden;
        }
        .file-wrapper:hover { border-color: var(--accent); transform: scale(1.01); background: rgba(108, 92, 231, 0.05); }
        .file-wrapper input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
        
        /* Preview Area & Animations */
        .image-area {
            width: 100%; height: 300px; background: #0f0f0f; border-radius: 16px;
            margin-bottom: 25px; display: none; justify-content: center; align-items: center;
            overflow: hidden; position: relative; border: 1px solid #333;
        }
        .image-area img { max-width: 100%; max-height: 100%; object-fit: contain; z-index: 1;}

        /* --- NEW SCANNER ANIMATION --- */
        .scan-line {
            position: absolute;
            top: -10%;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent), 0 0 30px var(--accent), 0 0 50px var(--accent);
            z-index: 5; /* Above image, below loader text */
            opacity: 0.8;
            display: none; /* Hidden by default */
            animation: scanMove 2s ease-in-out infinite;
            filter: blur(1px);
        }

        @keyframes scanMove {
            0% { top: -10%; opacity: 0.5; }
            50% { opacity: 1; }
            100% { top: 110%; opacity: 0.5; }
        }

        /* Loader Overlay */
        .loader-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* Lighter, semi-transparent background with blur so we can see the scanner */
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(3px);
            display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(108, 92, 231, 0.2);
            border-top: 4px solid var(--accent); border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite; /* More dynamic spin */
            margin-bottom: 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Buttons */
        .btn { 
            width: 100%; padding: 16px; background: var(--accent); color: white; border: none; 
            border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 1rem; 
            transition: all 0.3s ease; letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }
        .btn:hover:not(:disabled) { 
            background: var(--accent-hover); 
            transform: translateY(-3px); 
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.5);
        }
        .btn:disabled { background: #444; color: #888; box-shadow: none; transform: none; cursor: not-allowed;}

        /* Results with sequential animation */
        .result-box {
            margin-top: 25px; padding: 20px; background: rgba(0,0,0,0.25); border-radius: 16px;
            display: none; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* Individual result rows pop up sequentially */
        .res-row { 
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 12px; border-bottom: 1px solid #333;
            opacity: 0; transform: translateY(20px); /* Start hidden below */
            animation: rowPopup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .res-row:nth-child(1) { animation-delay: 0.1s; }
        .res-row:nth-child(2) { animation-delay: 0.2s; }
        .res-row:nth-child(3) { animation-delay: 0.3s; }

        @keyframes rowPopup { to { opacity: 1; transform: translateY(0); } }
        
        .res-row:last-child { border-bottom: none; padding-bottom: 0; }
        .tag { padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px;}
        .tag.red { background: rgba(255, 118, 117, 0.2); color: #ff7675; box-shadow: 0 0 10px rgba(255, 118, 117, 0.1); }
        .tag.green { background: rgba(85, 239, 196, 0.2); color: #55efc4; box-shadow: 0 0 10px rgba(85, 239, 196, 0.1); }

    </style>
</head>
<body>

<div class="container">
    <h1>Car Damage AI</h1>

    <div class="warning-box">
        <span style="font-size: 1.2rem;">⚠️</span>
        <span>First request may take ~1 min (API Cold Start). Please be patient.</span>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('upload')">Upload Image</div>
        <div class="tab" onclick="switchTab('url')">Image Link</div>
    </div>

    <div id="upload-group" class="input-group active">
        <div class="file-wrapper">
            <input type="file" id="fileInput" accept="image/*">
            <div style="text-align: center;">
                <p style="font-size: 2rem; color: var(--accent); margin-bottom: 10px;">📁</p>
                <p style="color:#aaa; font-weight: 500;">Tap or Drag & Drop Image</p>
            </div>
        </div>
    </div>

    <div id="url-group" class="input-group">
        <input type="text" id="urlInput" placeholder="https://example.com/car.jpg">
        <button class="btn" style="background:#333; padding:12px; box-shadow:none;" onclick="loadUrl()">Load Link</button>
    </div>

    <div class="image-area" id="previewBox">
        <img id="displayImage" src="" alt="Car Image">
        
        <div class="scan-line" id="scanLine"></div>

        <div class="loader-overlay" id="loader">
            <div class="spinner"></div>
            <p style="color:white; font-weight:600; letter-spacing: 1px;">AI ANALYZING...</p>
            <p style="color:#ccc; font-size:0.8rem; margin-top: 5px;">Searching for defects</p>
        </div>
    </div>

    <button class="btn" id="analyzeBtn" onclick="analyze()">DETECT DAMAGE</button>

    <div class="result-box" id="resultBox">
        <div class="res-row">
            <span style="color: var(--text-secondary);">Class Identified</span>
            <span id="resType" style="color:var(--accent); font-weight: 700; font-size: 1.1rem;">--</span>
        </div>
        <div class="res-row">
            <span style="color: var(--text-secondary);">AI Confidence</span>
            <span id="resConf" style="font-weight: 600;">--</span>
        </div>
        <div class="res-row">
            <span style="color: var(--text-secondary);">Condition Status</span>
            <span id="resStatus">--</span>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://junaid17-car-damage-detector.hf.space/predict_damage";
    let currentFile = null;

    // DOM Elements
    const fileInput = document.getElementById('fileInput');
    const displayImage = document.getElementById('displayImage');
    const previewBox = document.getElementById('previewBox');
    const resultBox = document.getElementById('resultBox');
    const loader = document.getElementById('loader');
    const scanLine = document.getElementById('scanLine'); // Get the scanner element
    const analyzeBtn = document.getElementById('analyzeBtn');

    function switchTab(t) {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.input-group').forEach(x => x.classList.remove('active'));
        if(t==='upload') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('upload-group').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('url-group').classList.add('active');
        }
        reset();
    }

    fileInput.addEventListener('change', e => {
        if(e.target.files[0]) {
            currentFile = e.target.files[0];
            const reader = new FileReader();
            reader.onload = x => showImage(x.target.result);
            reader.readAsDataURL(currentFile);
        }
    });

    async function loadUrl() {
        const urlBtn = document.querySelector('#url-group .btn');
        const url = document.getElementById('urlInput').value;
        if(!url) return;
        
        urlBtn.innerText = "Loading...";
        urlBtn.disabled = true;
        try {
            const res = await fetch(url);
            if(!res.ok) throw new Error('Network error');
            const blob = await res.blob();
            currentFile = new File([blob], "img.jpg", { type: blob.type });
            showImage(URL.createObjectURL(blob));
        } catch(e) { 
            alert("Cannot load image directly due to browser security (CORS). Please download the image and use the 'Upload' tab instead."); 
        } finally {
            urlBtn.innerText = "Load Link";
            urlBtn.disabled = false;
        }
    }

    function showImage(src) {
        displayImage.src = src;
        previewBox.style.display = 'flex';
        // Hide results when a new image is loaded
        resultBox.style.display = 'none';
        // Reset any previous animation states in results
        document.querySelectorAll('.res-row').forEach(row => {
             row.style.animation = 'none';
             row.offsetHeight; /* trigger reflow */
             row.style.animation = null; 
        });
    }

    function reset() {
        currentFile = null;
        previewBox.style.display = 'none';
        resultBox.style.display = 'none';
        fileInput.value = "";
        document.getElementById('urlInput').value = "";
    }

    async function analyze() {
        if(!currentFile) return alert("Please load an image first");
        
        // Start Animations
        loader.style.display = 'flex';
        scanLine.style.display = 'block'; // Turn on scanner line
        analyzeBtn.disabled = true;
        analyzeBtn.innerText = "Processing...";

        const formData = new FormData();
        formData.append('image', currentFile);

        try {
            const res = await fetch(API_URL, { method:'POST', body: formData });
            if(!res.ok) throw new Error("API Error");
            
            const data = await res.json();
            
            // 1. Update Image with the Annotated version from API
            if(data.annotated_image) {
                // Add a slight delay to smooth the transition between scanner and result image
                setTimeout(() => {
                     displayImage.src = "data:image/jpeg;base64," + data.annotated_image;
                }, 200);
            }

            // 2. Update Text Results
            document.getElementById('resType').innerText = data.damage_type.replace(/_/g, ' ');
            document.getElementById('resConf').innerText = (data.confidence * 100).toFixed(1) + "%";
            
            const statusEl = document.getElementById('resStatus');
            if(data.damage_detected) {
                statusEl.innerText = "Damage Detected";
                statusEl.className = "tag red";
            } else {
                statusEl.innerText = "No Visible Damage";
                statusEl.className = "tag green";
            }
            
            resultBox.style.display = 'flex';

        } catch(e) {
            alert("Error connecting to server. It might be waking up (takes ~30s) or offline. Please try again shortly.");
            console.error(e);
        } finally {
            // Stop Animations
            loader.style.display = 'none';
            scanLine.style.display = 'none'; // Turn off scanner line
            analyzeBtn.disabled = false;
            analyzeBtn.innerText = "DETECT DAMAGE";
        }
    }
</script>

</body>
</html>
